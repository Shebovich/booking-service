# Главный конфиг сервиса. Spring Boot читает его при старте.
# Аналог из Android: что-то среднее между BuildConfig и res/values,
# только читается в рантайме и переопределяется снаружи (переменные окружения, аргументы).

springdoc:
  paths-to-match:
    - /api/v1/**

spring:
  application:
    name: booking-service
  # День 5: подключение к базе. Значения — из compose.yaml (порт 5432, база/логин/пароль booking).
  # Пароль прямо в yml — только для локальной разработки, в проде секреты так не хранят.
  datasource:
    # jdbc:postgresql://<хост>:<порт>/<база>
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
  jpa:
    # OSIV выключен: EntityManager живёт только внутри транзакции, а не весь HTTP-запрос.
    # Ленивые связи вне сервиса не загрузятся тихо — упадут LazyInitializationException (подробно на шаге 2).
    open-in-view: false
    hibernate:
      # Hibernate НЕ создаёт таблицы, а только сверяет сущности со схемой при старте. Таблицы создаёт Flyway.
      ddl-auto: validate

server:
  port: 8080

# TODO День 5, шаг 2: включи лог SQL, чтобы видеть, что Hibernate шлёт в базу:
#   logging.level.org.hibernate.SQL: DEBUG              — сами запросы
#   logging.level.org.hibernate.orm.jdbc.bind: TRACE    — значения параметров вместо «?»
# В yml это вложенные ключи: logging: -> level: -> org.hibernate.SQL: DEBUG

# Наши собственные настройки. Имя раздела (booking) придумываем сами.
booking:
  greeting: Hello
  max-guests: 5
  hold-timeout: 10m

# Какие служебные эндпоинты Actuator открыть по HTTP.
# env и configprops показывают, какие настройки реально применились.
management:
  endpoints:
    web:
      exposure:
        include: health, info, env, configprops

---
# Всё ниже применяется ТОЛЬКО при активном профиле dev
# и переопределяет значения выше.
spring:
  config:
    activate:
      on-profile: dev

booking:
  greeting: Привет

logging:
  level:
    dev.pavel: DEBUG
