# Главный конфиг сервиса. Spring Boot читает его при старте.
# Аналог из Android: что-то среднее между BuildConfig и res/values,
# только читается в рантайме и переопределяется снаружи (переменные окружения, аргументы).

springdoc:
  paths-to-match:
    - /api/v1/**

spring:
  application:
    name: booking-service
  # TODO День 5, шаг 1: подключение к базе — внутри spring: (на одном уровне с application:)
  #   datasource:
  #     url:       jdbc:postgresql://<хост>:<порт>/<база>   — значения возьми из compose.yaml
  #     username:  ...
  #     password:  ...
  #   jpa:
  #     open-in-view: false     — почему false, разберём на шаге 2 (по умолчанию true, и Spring об этом предупреждает в логе)
  #     hibernate:
  #       ddl-auto: validate    — Hibernate НЕ создаёт таблицы, а только сверяет сущности со схемой. Таблицы создаёт Flyway.
  # Пароль прямо в yml — только для локальной разработки, в проде секреты так не хранят.

server:
  port: 8080

# Наши собственные настройки. Имя раздела (booking) придумываем сами.
booking:
  greeting: Hello
  max-guests: 5
  hold-timeout: 10m

# Какие служебные эндпоинты Actuator открыть по HTTP.
# env и configprops показывают, какие настройки реально применились.
management:
  endpoints:
    web:
      exposure:
        include: health, info, env, configprops

---
# Всё ниже применяется ТОЛЬКО при активном профиле dev
# и переопределяет значения выше.
spring:
  config:
    activate:
      on-profile: dev

booking:
  greeting: Привет

logging:
  level:
    dev.pavel: DEBUG
